# Project environment (exported 2026-10-26). Rebuild with:
#   conda env create -f ShellSim_vb_0_gpu.yml
# torch / torchvision / torchaudio +cu118 (CUDA 11.8 GPU builds) come from the PyTorch index below.
# Keep numpy 1.26.4: nlopt 2.7.1 (optimiser) needs numpy < 2 (nlopt >= 2.9 wheels require numpy >= 2).
